<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Escáner de productos</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 18px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reposiciones {
      background: #e8f0fe;
    }

    #ventas {
      background: #e8f5e9;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #resultado {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }

    #volver {
      display: none;
      background: #eeeeee;
    }
  </style>
</head>

<body>

  <h1>📷 Escáner de productos</h1>

  <div id="menu">

    <button id="reposiciones" onclick="iniciarEscaner('REPOSICIONES')">
      📦 REPOSICIONES
    </button>

    <button id="ventas" onclick="iniciarEscaner('VENTAS')">
      🛒 VENTAS
    </button>

  </div>

  <div id="reader"></div>

  <p id="resultado"></p>

  <button id="volver" onclick="volverMenu()">
    ↩️ Volver
  </button>


  <script>

    var scanner = null;
    var destinoActual = "";
    var escaneando = false;


    function iniciarEscaner(destino) {

      destinoActual = destino;
      escaneando = true;

      document.getElementById("menu").style.display = "none";
      document.getElementById("volver").style.display = "block";

      document.getElementById("resultado").innerHTML =
        "Solicitando acceso a la cámara...";

      document.getElementById("reader").innerHTML = "";

      scanner = new Html5Qrcode("reader");


      scanner.start(
        {
          facingMode: "environment"
        },
        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 150
          },

          aspectRatio: 1.777778
        },

        function(codigo) {
          codigoLeido(codigo);
        },

        function(error) {
          // Errores normales mientras busca un código.
        }

      ).then(function() {

        document.getElementById("resultado").innerHTML =
          "📷 Apunta la cámara al código de barras...";

      }).catch(function(error) {

        console.log("ERROR CÁMARA:", error);

        escaneando = false;

        document.getElementById("resultado").innerHTML =
          "❌ No se pudo abrir la cámara.<br><br>" +
          "Verifica que hayas permitido el acceso a la cámara.";

      });

    }


    function codigoLeido(codigo) {

      if (!escaneando) return;

      escaneando = false;

      document.getElementById("resultado").innerHTML =
        "Código leído: " + codigo;

      if (scanner) {

        scanner.stop().then(function() {

          scanner.clear();

          enviarCodigo(codigo);

        }).catch(function() {

          enviarCodigo(codigo);

        });

      } else {

        enviarCodigo(codigo);

      }

    }


    function enviarCodigo(codigo) {

      var url =
        "https://script.google.com/macros/s/AKfycbybUjLGJsQVBfQF78lta4z0leChViWBm0XvHosOPyrFJFFCI0lRw33QrakGd178rcA0/exec";


      var iframe = document.createElement("iframe");

      iframe.style.display = "none";

      iframe.src =
        url +
        "?codigo=" + encodeURIComponent(codigo) +
        "&destino=" + encodeURIComponent(destinoActual);

      document.body.appendChild(iframe);


      document.getElementById("resultado").innerHTML =
        "✅ Código enviado: " + codigo +
        "<br>Destino: " + destinoActual;

    }


    function volverMenu() {

      escaneando = false;

      if (scanner) {

        scanner.stop().then(function() {

          scanner.clear();

          scanner = null;

          mostrarMenu();

        }).catch(function() {

          scanner = null;

          mostrarMenu();

        });

      } else {

        mostrarMenu();

      }

    }


    function mostrarMenu() {

      document.getElementById("reader").innerHTML = "";

      document.getElementById("resultado").innerHTML = "";

      document.getElementById("menu").style.display = "block";

      document.getElementById("volver").style.display = "none";

    }

  </script>

</body>
</html>
